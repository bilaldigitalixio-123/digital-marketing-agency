<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium WordPress Developer Portfolio</title>
    <!-- Premium Typography & Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* CSS STYLING */
        :root {
            --bg-dark: #06040d;
            --bg-card: #0d0a1a;
            --primary: #7c3aed;
            --secondary: #06b6d4;
            --accent: #ff007a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas Particle Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Custom Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #231d3a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Header Navbar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            background: rgba(6, 4, 13, 0.7);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: var(--gradient);
            transition: 0.3s;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* Global Dynamic Buttons */
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            margin-left: 15px;
        }

        .btn-secondary:hover {
            border-color: var(--secondary);
            background: rgba(6, 182, 212, 0.05);
            transform: translateY(-4px);
        }

        /* Hero Section */
        section {
            padding: 120px 8% 100px;
            position: relative;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .hero-content {
            max-width: 800px;
            z-index: 10;
        }

        .badge {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            color: #a78bfa;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 64px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        /* JavaScript Dynamic Typing Text Styling */
        .typing-text {
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: var(--secondary);
            margin-left: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 600px;
        }

        /* Section Reveal Animation Base */
        .reveal {
            position: relative;
            transform: translateY(50px);
            opacity: 0;
            transition: all 1s ease;
        }

        .reveal.active {
            transform: translateY(0);
            opacity: 1;
        }

        h2.section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            margin-bottom: 60px;
            position: relative;
        }

        h2.section-title span {
            color: var(--primary);
        }

        /* Services Grid Layout */
        .services-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-box {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 40px 30px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .service-box:hover {
            transform: translateY(-10px);
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.1);
        }

        .service-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent 70%, rgba(6, 182, 212, 0.05));
            opacity: 0;
            transition: 0.4s;
        }

        .service-box:hover::before {
            opacity: 1;
        }

        .service-box h3 {
            font-size: 22px;
            margin-bottom: 15px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .service-box p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* Projects Showcase Framework */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 35px;
        }

        .project-card {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.4s ease;
        }

        .project-card:hover {
            transform: scale(1.02);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .project-img-placeholder {
            height: 220px;
            background: linear-gradient(45deg, #16122c, #090614);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .project-img-placeholder::after {
            content: 'WordPress Dashboard Realized';
            color: rgba(255, 255, 255, 0.05);
            font-size: 24px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }

        .project-details {
            padding: 30px;
        }

        .project-details h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .project-details p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tag-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: var(--text-main);
        }

        /* Contact Modern Block */
        .contact-wrapper {
            max-width: 650px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 50px;
